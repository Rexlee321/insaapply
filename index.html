<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>인사 내신서</title>
  <style>
    body { font-family:"맑은 고딕", sans-serif; margin: 24px; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 24px; }
    th, td { border: 1px solid #000; padding: 12px; text-align: center; font-size: 16px; }
    input[type="text"], input[type="tel"] { width: 95%; padding: 6px; border: none; text-align: center; font-size: 15px; }
    .submit-btn { padding: 12px 24px; background-color: #4CAF50; color: white; border: none; cursor: pointer; font-size: 18px; border-radius: 6px; }
    .error { color: #c62828; font-size: 14px; margin: 12px 0; display: none; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbypah7edDgsgpFqbg9GvKpSwoZFzB2aQ8sV9HVaXr59De42r5X5Hd5COxYJVa-gKzMG/exec";
    const SECRET = "MY_SECRET_123";

    function validate(form) {
      const errors = [];
      const dept = form.department.value.trim();
      const name = form.name.value.trim();
      const phone = form.phone.value.trim();
      const phoneOk = /^(01[0-9]|02|0[3-9][0-9])[- ]?\d{3,4}[- ]?\d{4}$/.test(phone);
      if (!dept) errors.push("소속을 입력해 주세요.");
      if (!name) errors.push("성명을 입력해 주세요.");
      if (!phoneOk) errors.push("전화번호 형식을 확인해 주세요.");
      const box = document.getElementById("error-box");
      box.innerHTML = errors.map(e => "• " + e).join("<br>");
      box.style.display = errors.length ? "block" : "none";
      return errors.length === 0;
    }

    function getRadio(form, name) {
      const el = form.querySelector(`input[name="${name}"]:checked`);
      return el ? el.value : "";
    }

    function collectData(form) {
      return {
        department: form.department.value.trim(),
        rank: form.rank.value.trim(),
        name: form.name.value.trim(),
        current_position: form.current_position.value.trim(),
        career: form.career.value.trim(),
        phone: form.phone.value.trim(),
        qualification: getRadio(form, "qualification"),
        grade: getRadio(form, "grade"),
        hopes: [1,2,3,4,5].map(i => ({
          order: i,
          position: form[`pos${i}`].value.trim(),
          education: getRadio(form, `edu${i}`)
        })),
        submitter: form.submitter.value.trim()
      };
    }

    function toHeaderAndRow(data) {
      const header = ["소속", "계급", "성명(나이)", "현급 배명", "경과", "전화번호",
        "보직기준 충족", "수사관 자격등급",
        "1 희망 보직", "1 희망 직위 교육이수",
        "2 희망 보직", "2 희망 직위 교육이수",
        "3 희망 보직", "3 희망 직위 교육이수",
        "4 희망 보직", "4 희망 직위 교육이수",
        "5 희망 보직", "5 희망 직위 교육이수",
        "제출자 성명", "제출 시각(ISO)"];
      const row = [
        data.department, data.rank, data.name, data.current_position, data.career, data.phone,
        data.qualification, data.grade,
        ...data.hopes.flatMap(h => [h.position, h.education]),
        data.submitter, new Date().toISOString()
      ];
      return { header, row };
    }

    function downloadExcel(header, row) {
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.aoa_to_sheet([header, row]);
      XLSX.utils.book_append_sheet(wb, ws, "제출내역");
      const ts = new Date();
      const pad = n => String(n).padStart(2, "0");
      const fname = `insa_form_${ts.getFullYear()}${pad(ts.getMonth()+1)}${pad(ts.getDate())}_${pad(ts.getHours())}${pad(ts.getMinutes())}${pad(ts.getSeconds())}.xlsx`;
      XLSX.writeFile(wb, fname);
    }

    async function saveForm() {
      const form = document.getElementById("insaForm");
      if (!validate(form)) return;

      const data = collectData(form);
      const { header, row } = toHeaderAndRow(data);

      try {
        await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ header, row, secret: SECRET })
        });
      } catch (e) {
        console.warn("서버 저장 실패", e);
      }

      try { downloadExcel(header, row); } catch (e) { console.warn("엑셀 저장 실패", e); }

      alert("제출되었습니다.");
    }
  </script>
</head>
<body>
  <h1>인 사 내 신 서</h1>
  <form id="insaForm" onsubmit="return false;">
    <div id="error-box" class="error"></div>

    <!-- 기본정보 -->
    <table>
      <tr>
        <th>소속</th><td><input type="text" name="department" /></td>
        <th>계급</th><td><input type="text" name="rank" /></td>
        <th>성명(나이)</th><td><input type="text" name="name" /></td>
      </tr>
      <tr>
        <th>현급 배명</th><td><input type="text" name="current_position" /></td>
        <th>경과</th><td><input type="text" name="career" /></td>
        <th>전화번호</th><td><input type="tel" name="phone" /></td>
      </tr>
    </table>

    <!-- 팀장 기준 -->
    <table>
      <tr>
        <th colspan="2">팀장 보직기준 충족 여부</th>
        <td colspan="4">
          <label><input type="radio" name="qualification" value="O" /> O</label>
          <label><input type="radio" name="qualification" value="X" /> X</label>
        </td>
      </tr>
      <tr>
        <th colspan="2">수사관 자격등급</th>
        <td colspan="4">
          <label><input type="radio" name="grade" value="top5" /> 최종상위5%</label>
          <label><input type="radio" name="grade" value="responsible" /> 책임</label>
          <label><input type="radio" name="grade" value="fulltime" /> 전임</label>
        </td>
      </tr>
    </table>

    <!-- 희망 직위 -->
    <table>
      <tr><th colspan="4">희망 직위</th></tr>
      ${[1,2,3,4,5].map(i => `
        <tr>
          <td>${i} 희망</td>
          <td><input type="text" name="pos${i}" /></td>
          <td>교육이수</td>
          <td>
            <label><input type="radio" name="edu${i}" value="이수" /> 이수</label>
            <label><input type="radio" name="edu${i}" value="미이수" /> 미이수</label>
          </td>
        </tr>`).join("")}
    </table>

    <p style="text-align:right;">제출자 성명 <input type="text" name="submitter" style="width:200px;" /> (인)</p>
    <div style="text-align:center;">
      <button type="button" class="submit-btn" onclick="saveForm()">제출하기</button>
    </div>
  </form>
</body>
</html>
