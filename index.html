 <!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>인사 내신서</title>
  <style>
    body { font-family: "맑은 고딕", sans-serif; margin: 20px; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
    th, td { border: 1px solid #000; padding: 12px; text-align: center; font-size: 16px; }
    th { background-color: #f9f9f9; }
    input[type="text"], input[type="tel"] { width: 95%; padding: 5px; border: none; text-align: center; font-size: 15px; }
    .submit-btn { display: block; margin: 20px auto; padding: 12px 24px; background-color: #4CAF50; color: #fff; border: none; cursor: pointer; font-size: 18px; border-radius: 5px; }
    .error { color: red; font-size: 14px; margin-bottom: 10px; display: none; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbx2bSc0FcKQjIIoUkODcgmm85Qi4LtmPMtoKxT5Pv3gJtgAice-0QKPqJf89XTgr-Vg/exec"; // <- 본인 웹앱 주소로 바꾸세요
    const SECRET = "CHANGE_ME_SECRET"; // <- Apps Script와 동일한 값

    function validate(form) {
      const errorBox = document.getElementById("error-box");
      errorBox.innerHTML = "";
      let errors = [];

      if (!form.department.value.trim()) errors.push("소속을 입력해 주세요.");
      if (!form.name.value.trim()) errors.push("성명을 입력해 주세요.");
      const phone = form.phone.value.trim();
      const phoneRegex = /^(01[0-9]|02|0[3-9][0-9])[- ]?\d{3,4}[- ]?\d{4}$/;
      if (!phoneRegex.test(phone)) errors.push("전화번호 형식이 올바르지 않습니다. (예: 010-1234-5678)");

      if (errors.length > 0) {
        errorBox.style.display = "block";
        errorBox.innerHTML = errors.map(e => `<div>• ${e}</div>`).join("");
        return false;
      } else {
        errorBox.style.display = "none";
        return true;
      }
    }

    function getFormData(form) {
      const getRadio = (name) => {
        const selected = form.querySelector(`input[name="${name}"]:checked`);
        return selected ? selected.value : "";
      };
      return {
        department: form.department.value.trim(),
        rank: form.rank.value.trim(),
        name: form.name.value.trim(),
        current_position: form.current_position.value.trim(),
        career: form.career.value.trim(),
        phone: form.phone.value.trim(),
        qualification: getRadio("qualification"),
        grade: getRadio("grade"),
        hopes: [
          { position: form.pos1.value.trim(), education: getRadio("edu1") },
          { position: form.pos2.value.trim(), education: getRadio("edu2") },
          { position: form.pos3.value.trim(), education: getRadio("edu3") },
          { position: form.pos4.value.trim(), education: getRadio("edu4") },
          { position: form.pos5.value.trim(), education: getRadio("edu5") }
        ],
        submitter: form.submitter.value.trim()
      };
    }

    function toSheetRow(data) {
      return [
        data.department, data.rank, data.name, data.current_position, data.career, data.phone,
        data.qualification, data.grade,
        data.hopes[0].position, data.hopes[0].education,
        data.hopes[1].position, data.hopes[1].education,
        data.hopes[2].position, data.hopes[2].education,
        data.hopes[3].position, data.hopes[3].education,
        data.hopes[4].position, data.hopes[4].education,
        data.submitter,
        new Date().toISOString()
      ];
    }

    async function saveForm() {
      const form = document.getElementById("insaForm");
      if (!validate(form)) return;

      const data = getFormData(form);
      const header = [
        "소속", "계급", "성명", "현급 배명", "경과", "전화번호",
        "보직기준 충족", "자격등급",
        "1 희망 보직", "1 교육이수",
        "2 희망 보직", "2 교육이수",
        "3 희망 보직", "3 교육이수",
        "4 희망 보직", "4 교육이수",
        "5 희망 보직", "5 교육이수",
        "제출자", "제출 시각"
      ];
      const row = toSheetRow(data);

      // 서버 전송
      let success = false;
      try {
        const res = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ header, row, secret: SECRET })
        });
        const result = await res.json();
        if (result.status === "ok") success = true;
      } catch (err) {
        console.warn("서버 저장 실패", err);
      }

      // 로컬 엑셀 저장
      try {
        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.aoa_to_sheet([header, row]);
        XLSX.utils.book_append_sheet(wb, ws, "제출내역");
        XLSX.writeFile(wb, `insa_form_${Date.now()}.xlsx`);
      } catch (err) {
        console.error("엑셀 저장 실패", err);
      }

      alert(success
        ? "✅ 제출되었습니다. (서버 저장 완료 + 엑셀 저장)"
        : "⚠️ 서버 저장 실패 (엑셀은 저장됨)");
    }
  </script>
</head>
<body>
  <h1>인 사 내 신 서</h1>
  <form id="insaForm" onsubmit="return false;">
    <div id="error-box" class="error"></div>
    <table>
      <tr>
        <th>소속</th><td><input type="text" name="department" /></td>
        <th>계급</th><td><input type="text" name="rank" /></td>
        <th>성명</th><td><input type="text" name="name" /></td>
      </tr>
      <tr>
        <th>현급 배명</th><td><input type="text" name="current_position" /></td>
        <th>경과</th><td><input type="text" name="career" /></td>
        <th>전화번호</th><td><input type="tel" name="phone" placeholder="010-1234-5678" /></td>
      </tr>
    </table>

    <p style="text-align:right; font-size:16px;">제출자 성명 <input type="text" name="submitter" style="width:200px;"> (인)</p>
    <button type="button" class="submit-btn" onclick="saveForm()">제출하기</button>
  </form>
</body>
</html>
